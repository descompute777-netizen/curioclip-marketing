name: Analytics + Métricas Diarias (every 2h)

on:
  schedule:
    # Cada 2 horas en minuto 7 (evitar pico :00)
    - cron: '7 */2 * * *'
  workflow_dispatch: {}

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic

      - name: Calibrate predictor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/pipeline/calibrate_predictor.py || echo "Calibration skipped"
        continue-on-error: true

      - name: Generate weekly report
        run: |
          python src/pipeline/generate_weekly_report.py || echo "Report skipped"
        continue-on-error: true

      - name: Daily metrics agent (analytics-scientist)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/autonomous/daily_metrics.py || echo "Daily metrics skipped"
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "CurioClip-Bot"
          git config user.email "bot@curioclip.ai"
          git add obsidian_vault/50_Analitica/ obsidian_vault/60_Aprendizaje/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: analytics auto-update [$(date +%Y-%m-%d %H:%M)] [skip ci]"
            git push || echo "Push skipped"
          fi
