name: "Analytics + Evolution Engine (every 6h)"

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch: {}

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install requests anthropic openai

      - name: "Step 1: Pattern Analysis + Calibration"
        run: |
          python scripts/learn/analyze_patterns.py || echo "[WARN] analyze_patterns failed"
          python scripts/learn/generate_insights.py || echo "[WARN] generate_insights failed"

      - name: "Step 2: Evolution Engine (strategy evolution)"
        run: python scripts/learn/evolution_engine.py

      - name: "Step 3: Verify strategy file"
        run: |
          echo "=== content_strategy.json ==="
          python -c "import json; s=json.load(open('config/content_strategy.json')); print(f'v{s[\"version\"]} | growth={s[\"growth\"][\"trajectory\"]} | niches={len(s[\"niche_weights\"])} | restrict={s[\"restrictions\"][\"shadowban_risk\"]}')"

      - name: Commit evolved strategy + insights
        run: |
          git config user.name "CurioClip-Bot"
          git config user.email "bot@curioclip.ai"
          git add config/content_strategy.json 2>/dev/null || true
          git add obsidian_vault/50_Analitica/ obsidian_vault/60_Aprendizaje/ 2>/dev/null || true
          git add obsidian_vault/40_Publicacion/alerts/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: analytics auto-update [$(date +%Y-%m-%d %H:%M)] [skip ci]"
            git push || echo "Push failed"
          fi
